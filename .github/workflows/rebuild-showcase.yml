name: Rebuild showcase GIF

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-showcase-gif.py"
      - ".github/workflows/rebuild-showcase.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Build complete animation
        run: python scripts/build-showcase-gif.py

      - name: Verify animation
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          path = Path("screenshots/all-30-skins-slow.gif")
          image = Image.open(path)
          assert image.n_frames == 270, image.n_frames
          assert image.size == (1440, 810), image.size
          assert path.stat().st_size > 7_000_000, path.stat().st_size
          print(path, image.n_frames, image.size, path.stat().st_size)
          PY

      - name: Commit rebuilt GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/all-30-skins-slow.gif
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild complete 30-skin showcase GIF"
          git push
